<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Grade e Optativas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; display: flex; gap: 20px; flex-wrap: wrap; }
        .painel { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
        .grade-container { flex: 2; min-width: 600px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow-x: auto;}
        h1, h2 { color: #004a8f; margin-top: 0; }
        .creditos-box { font-size: 1.5em; font-weight: bold; text-align: center; margin: 20px 0; padding: 15px; border-radius: 8px; }
        .valido { background-color: #e8f5e9; color: #2e7d32; border: 2px solid #4caf50; }
        .invalido { background-color: #ffebee; color: #c62828; border: 2px solid #f44336; }
        label { display: block; margin-bottom: 10px; cursor: pointer; padding: 5px; border-radius: 4px; transition: background 0.2s; }
        label:hover { background: #f0f0f0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #004a8f; color: white; }
        .livre { background-color: #f9f9f9; color: #aaa; }
        .obrigatoria { background-color: #e3f2fd; color: #1565c0; font-weight: bold; }
        .optativa { background-color: #fff3e0; color: #e65100; font-weight: bold; border: 2px solid #ff9800; }
        .trancada { background-color: #ffebee; color: #c62828; text-decoration: line-through; }
        hr { border: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- PAINEL DE CONTROLE -->
    <div class="painel">
        <h2>Painel de Disciplinas</h2>
        
        <div id="creditos-display" class="creditos-box valido">
            Créditos: <span id="total-creditos">34</span>
            <div style="font-size: 0.5em; margin-top: 5px;">Mínimo exigido: 12</div>
        </div>

        <h3>Trancar Obrigatórias (2º Período)</h3>
        <label><input type="checkbox" id="chk-morfo" onchange="atualizarGrade()"> Morfologia da Cabeça e Pescoço (Tranca conjuntas)</label>
        <label><input type="checkbox" id="chk-materiais" onchange="atualizarGrade()"> Materiais Odontológicos I (Tranca Dentística)</label>

        <hr>

        <h3>Adicionar Optativas Livres</h3>
        <label><input type="checkbox" id="opt-implantologia" onchange="atualizarGrade()"> Implantologia Clínica II (Seg, 9h-12h)</label>
        <label><input type="checkbox" id="opt-cirurgia" onchange="atualizarGrade()"> Estágio Amb. Cirurgia Oral (Ter, 8h-12h)</label>
        <label><input type="checkbox" id="opt-dape" onchange="atualizarGrade()"> DAPE II (Qua, 13h-17h)</label>
        <label><input type="checkbox" id="opt-bioestatistica" onchange="atualizarGrade()"> Bioestatística Básica (Qui, 14h-18h)</label>
    </div>

    <!-- GRADE HORÁRIA -->
    <div class="grade-container">
        <h2>Sua Grade Horária</h2>
        <table>
            <thead>
                <tr>
                    <th>Horário</th>
                    <th>Segunda</th>
                    <th>Terça</th>
                    <th>Quarta</th>
                    <th>Quinta</th>
                    <th>Sexta</th>
                </tr>
            </thead>
            <tbody id="grade-corpo">
                <!-- Gerado pelo JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Configuração inicial da grade (34 créditos originais)
    let creditosIniciais = 34;

    function atualizarGrade() {
        // Lógica de Indicação de Conjunto
        const trancaMorfo = document.getElementById('chk-morfo').checked;
        const trancaMateriais = document.getElementById('chk-materiais').checked;

        // Regras de dependência
        const trancaDentistica = trancaMorfo || trancaMateriais;
        const trancaRadiologia = trancaMorfo;
        const trancaMateriaisEfetivo = trancaMorfo || trancaMateriais;

        // Lógica das Optativas
        const optImplantologia = document.getElementById('opt-implantologia').checked;
        const optCirurgia = document.getElementById('opt-cirurgia').checked;
        const optDape = document.getElementById('opt-dape').checked;
        const optBioestatistica = document.getElementById('opt-bioestatistica').checked;

        // Cálculo de Créditos
        let creditos = creditosIniciais;
        if (trancaMorfo) creditos -= 7;
        if (trancaMateriaisEfetivo && !trancaMorfo) creditos -= 4; // Para não subtrair 2x se morfo já subtraiu
        if (trancaDentistica && !trancaMorfo) creditos -= 4;
        if (trancaRadiologia && !trancaMorfo) creditos -= 4;

        if (optImplantologia) creditos += 3; // Valor estimado para optativa
        if (optCirurgia) creditos += 4;
        if (optDape) creditos += 4;
        if (optBioestatistica) creditos += 4;

        // Atualiza display de créditos
        const display = document.getElementById('creditos-display');
        document.getElementById('total-creditos').innerText = creditos;
        if (creditos < 12) {
            display.className = 'creditos-box invalido';
        } else {
            display.className = 'creditos-box valido';
        }

        // Função auxiliar para definir classe e texto da célula
        const celula = (texto, tipo) => `<td class="${tipo}">${texto}</td>`;

        // Construção da Tabela
        let htmlGrade = '';

        // Manhã (08h - 12h simplificado)
        htmlGrade += '<tr><td>08h00 - 12h00</td>';
        
        // Segunda Manhã
        if (optImplantologia) htmlGrade += celula('Implantologia Clínica II<br>(Optativa)', 'optativa');
        else if (trancaDentistica) htmlGrade += celula('Dentística Pré-Clínica I<br>(Trancada)', 'trancada');
        else htmlGrade += celula('Dentística Pré-Clínica I<br>(Obrigatória)', 'obrigatoria');

        // Terça Manhã
        if (optCirurgia) htmlGrade += celula('Estágio em Cirurgia Oral<br>(Optativa)', 'optativa');
        else if (trancaMateriaisEfetivo) htmlGrade += celula('Materiais Odontológicos I<br>(Trancada)', 'trancada');
        else htmlGrade += celula('Materiais Odontológicos I<br>(Obrigatória)', 'obrigatoria');

        // Quarta Manhã (Fixo Patologia)
        htmlGrade += celula('Patologia Básica<br>(Obrigatória)', 'obrigatoria');
        
        // Quinta Manhã (Fixo Microbiologia)
        htmlGrade += celula('Microbiologia<br>(Obrigatória)', 'obrigatoria');

        // Sexta Manhã (Fixo Bioquímica)
        htmlGrade += celula('Bioquímica Bucal<br>(Obrigatória)', 'obrigatoria');
        
        htmlGrade += '</tr>';

        // Tarde (14h - 18h simplificado)
        htmlGrade += '<tr><td>14h00 - 18h00</td>';
        
        // Segunda Tarde (Fixo Fisiologia)
        htmlGrade += celula('Fisiologia Aplicada I<br>(Obrigatória)', 'obrigatoria');

        // Terça Tarde
        if (trancaMorfo) htmlGrade += celula('Morfologia da C.P.<br>(Trancada)', 'trancada');
        else htmlGrade += celula('Morfologia da C.P.<br>(Obrigatória)', 'obrigatoria');

        // Quarta Tarde
        if (optDape) htmlGrade += celula('DAPE II<br>(Optativa)', 'optativa');
        else if (trancaMorfo) htmlGrade += celula('Morfologia da C.P.<br>(Trancada)', 'trancada');
        else htmlGrade += celula('Morfologia da C.P.<br>(Obrigatória)', 'obrigatoria');

        // Quinta Tarde
        if (optBioestatistica) htmlGrade += celula('Bioestatística Básica<br>(Optativa)', 'optativa');
        else if (trancaRadiologia) htmlGrade += celula('Radiologia Odontológica<br>(Trancada)', 'trancada');
        else htmlGrade += celula('Radiologia Odontológica<br>(Obrigatória)', 'obrigatoria');

        // Sexta Tarde
        htmlGrade += celula('- Livre -', 'livre');

        htmlGrade += '</tr>';

        document.getElementById('grade-corpo').innerHTML = htmlGrade;
    }

    // Inicializa a grade ao carregar a página
    window.onload = atualizarGrade;
</script>

</body>
</html>
